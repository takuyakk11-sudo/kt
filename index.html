<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Menu</title>
  <!-- Google Fontsの読み込み（洗練された欧文フォント ＆ Noto Sans JP） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* ▼ ここで背景色を変更できます（現在は上品な生成り色） */
      --bg-color: #f2efe9;       
      
      --card-bg: #ffffff;        /* ピュアホワイト */
      --text-main: #1a1a1a;      /* 深い黒 */
      --text-sub: #777777;       /* 絶妙なニュアンスのグレー */
      --border-color: #e6e2db;   /* 背景色に合わせた繊細な境界線 */
      --accent-dark: #111111;    /* ホバー時のシャープな黒 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    /* 英語のおしゃれなサブタイトル風フォント */
    .brand-tag {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--text-sub);
      letter-spacing: 0.15em;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--text-main);
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a.menu-card {
      display: flex;
      align-items: center;
      padding: 18px 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    /* ホバー時のリッチな浮き上がり効果（PC） */
    @media (hover: hover) {
      a.menu-card:hover {
        transform: translateY(-3px);
        border-color: var(--accent-dark);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }
      a.menu-card:hover .arrow {
        transform: translateX(4px);
        color: var(--accent-dark);
      }
    }

    /* タップ時の反応（スマホ） */
    a.menu-card:active {
      transform: scale(0.98);
      background-color: #fafafa;
    }

    .icon-box {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background-color: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      margin-right: 16px;
      flex-shrink: 0;
    }

    .card-content {
      flex-grow: 1;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 500;
      margin-bottom: 2px;
      display: block;
      letter-spacing: 0.03em;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 0.75rem;
      color: var(--text-sub);
      display: block;
    }

    /* ミニマルな矢印デザイン */
    .arrow {
      color: #cccccc;
      font-size: 1.1rem;
      font-weight: 300;
      margin-left: 12px;
      transition: transform 0.3s ease, color 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-tag">- Selection -</div>
      <h1>アプリメニュー</h1>
    </header>

    <ul>
      <li>
        <a href="Deep_Breath-Ver3.html" class="menu-card">
          <div class="icon-box">🌿</div>
          <div class="card-content">
            <span class="card-title">深呼吸</span>
            <span class="card-desc">リラックス＆呼吸リズムガイド</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </li>

      <li>
        <a href="waniwani2.html" class="menu-card">
          <div class="icon-box">🐊</div>
          <div class="card-content">
            <span class="card-title">ワニワニ・リバーシューター</span>
            <span class="card-desc">PCブラウザ向けアクションゲーム</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </li>

      <li>
        <a href="waniwani-sumaho3.html" class="menu-card">
          <div class="icon-box">📱</div>
          <div class="card-content">
            <span class="card-title">ワニワニ・リバーシューター</span>
            <span class="card-desc">スマホ版（横画面プレイ推奨）</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </li>

      <li>
        <a href="https://example.com/4" class="menu-card">
          <div class="icon-box">🔗</div>
          <div class="card-content">
            <span class="card-title">リンク4</span>
            <span class="card-desc">外部リンク・その他のコンテンツ</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </li>
    </ul>
  </div>

</body>
</html>
