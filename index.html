<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メニュー</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 400px;
      margin: 50px auto;
      padding: 0 20px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin-bottom: 10px;
    }
    a {
      display: block;
      padding: 12px 16px;
      background-color: #f0f0f0;
      color: #333;
      text-decoration: none;
      border-radius: 6px;
    }
    a:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

  <h1>メニュー</h1>
  <ul>
    <li><a href="https://example.com/1">リンク1</a></li>
    <li><a href="https://example.com/2">リンク2</a></li>
    <li><a href="https://example.com/3">リンク3</a></li>
    <li><a href="https://example.com/4">リンク4</a></li>
  </ul>

</body>
</html>
