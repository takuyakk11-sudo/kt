<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アプリメニュー</title>
  <!-- Google Fontsの読み込み（視認性の高いモダンなフォント） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8f9fa;       /* わずかにグレーがかった白（目に優しい背景） */
      --card-bg: #ffffff;        /* カードの純白 */
      --text-main: #111111;      /* 濃い黒（メインテキスト） */
      --text-sub: #555555;       /* ダークグレー（説明文） */
      --border-color: #e0e0e0;   /* 境界線の薄いグレー */
      --accent-black: #111111;   /* アクセント用の黒 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* スマホでタップした時の不要な青い枠を消す */
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    a.menu-card {
      display: flex;
      align-items: center;
      padding: 20px 18px;
      background-color: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* PCでのホバー時（黒枠が強調される） */
    @media (hover: hover) {
      a.menu-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent-black);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      }
      a.menu-card:hover .arrow {
        transform: translateX(4px);
        color: var(--accent-black);
      }
    }

    /* スマホでタップした瞬間の押し込み反応 */
    a.menu-card:active {
      transform: scale(0.98);
      background-color: #f2f2f2;
      border-color: var(--accent-black);
    }

    .icon-box {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background-color: #111111; /* 黒背景 */
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      margin-right: 16px;
      flex-shrink: 0;
    }

    .card-content {
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: block;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--text-sub);
      display: block;
    }

    /* スマホでもひと目で「リンク（押せる）」と分かるバッジ風矢印 */
    .arrow {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #f0f0f0;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1rem;
      font-weight: bold;
      margin-left: 12px;
      flex-shrink: 0;
      transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
    }

    a.menu-card:active .arrow {
      background-color: var(--accent-black);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>アプリメニュー</h1>
      <p class="subtitle">使いたいコンテンツをタップしてください</p>
    </header>

    <ul>
      <li>
        <a href="Deep_Breath-Ver3.html" class="menu-card">
          <div class="icon-box">🌿</div>
          <div class="card-content">
            <span class="card-title">深呼吸</span>
            <span class="card-desc">リラックス＆呼吸リズムガイド</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </li>

      <li>
        <a href="waniwani2.html" class="menu-card">
          <div class="icon-box">🐊</div>
          <div class="card-content">
            <span class="card-title">ワニワニ・リバーシューター</span>
            <span class="card-desc">PCブラウザ向けアクションゲーム</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </li>

      <li>
        <a href="waniwani-sumaho3.html" class="menu-card">
          <div class="icon-box">📱</div>
          <div class="card-content">
            <span class="card-title">ワニワニ・リバーシューター</span>
            <span class="card-desc">スマホ版（横画面プレイ推奨）</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </li>

      <li>
        <a href="https://example.com/4" class="menu-card">
          <div class="icon-box">🔗</div>
          <div class="card-content">
            <span class="card-title">リンク4</span>
            <span class="card-desc">外部リンク・その他のコンテンツ</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </li>
    </ul>
  </div>

</body>
</html>
