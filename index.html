<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アプリメニュー</title>
  <!-- Google Fontsの読み込み（丸みのあるモダンなフォント） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-main: #1e293b;
      --text-sub: #64748b;
      --accent-color: #0ea5e9;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 10px 25px -5px rgba(14, 165, 233, 0.15), 0 8px 10px -6px rgba(14, 165, 233, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    a.menu-card {
      display: flex;
      align-items: center;
      padding: 18px 20px;
      background-color: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    /* ホバー時の浮き上がり＆光るアニメーション */
    a.menu-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(14, 165, 233, 0.3);
    }

    a.menu-card:active {
      transform: translateY(-1px);
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      margin-right: 16px;
      flex-shrink: 0;
    }

    /* 各アイテムごとのアイコン背景色 */
    .icon-breath { background-color: #e0f2fe; color: #0284c7; }
    .icon-game-pc { background-color: #dcfce7; color: #16a34a; }
    .icon-game-sp { background-color: #fef3c7; color: #d97706; }
    .icon-other   { background-color: #f1f5f9; color: #475569; }

    .card-content {
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: block;
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--text-sub);
      display: block;
    }

    .arrow {
      color: #cbd5e1;
      font-size: 1.2rem;
      font-weight: bold;
      margin-left: 12px;
      transition: transform 0.25s ease, color 0.25s ease;
    }

    a.menu-card:hover .arrow {
      transform: translateX(4px);
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>アプリメニュー</h1>
      <p class="subtitle">遊びたい・使いたいコンテンツを選んでください</p>
    </header>

    <ul>
      <li>
        <a href="Deep_Breath-Ver3.html" class="menu-card">
          <div class="icon-box icon-breath">🌿</div>
          <div class="card-content">
            <span class="card-title">深呼吸</span>
            <span class="card-desc">リラックス＆呼吸リズムガイド</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </li>

      <li>
        <a href="waniwani2.html" class="menu-card">
          <div class="icon-box icon-game-pc">🐊</div>
          <div class="card-content">
            <span class="card-title">ワニワニ・リバーシューター</span>
            <span class="card-desc">PCブラウザ向けアクションゲーム</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </li>

      <li>
        <a href="waniwani-sumaho3.html" class="menu-card">
          <div class="icon-box icon-game-sp">📱</div>
          <div class="card-content">
            <span class="card-title">ワニワニ・リバーシューター</span>
            <span class="card-desc">スマホ版（横画面プレイ推奨）</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </li>

      <li>
        <a href="https://example.com/4" class="menu-card">
          <div class="icon-box icon-other">🔗</div>
          <div class="card-content">
            <span class="card-title">リンク4</span>
            <span class="card-desc">外部リンク・その他のコンテンツ</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </li>
    </ul>
  </div>

</body>
</html>
